name: "CI"

on:
  push:
    branches: 
      - "main"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: 
      - "main"
  workflow_dispatch:
  

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: write


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [x86_64-linux]
        system: [x86_64-linux]
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Use latest India OSM data
        run: nix flake lock --update-input india-latest

      - name: Build all flake outputs
        run: om ci
      
      - name: Build And Push Docker image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DOCKER_REGISTRY: ghcr.io
        run: |
          nix build .#packages.${{ matrix.system }}.dockerImage
          
          # Tag by the commit SHA, not the flake's imageTag: the india-latest
          # re-lock step above dirties the git tree, so self.rev is unset and
          # imageTag falls back to "dev". GITHUB_SHA is the commit being built.
          BASE_IMAGE="$(nix eval --raw .#packages.${{ matrix.system }}.dockerImage.imageName):${GITHUB_SHA::6}"
          echo "BASE_IMAGE=${BASE_IMAGE}"
          
          mkdir -p /tmp/docker-image
          
          echo "Extracting image to /tmp/docker-image/image.tar"
          gunzip -c ./result > /tmp/docker-image/image.tar || cp ./result /tmp/docker-image/image.tar
          
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ${DOCKER_REGISTRY} -u "${{ github.actor }}" --password-stdin
          
          echo "Pushing image to ${BASE_IMAGE}"
          crane push /tmp/docker-image/image.tar "${BASE_IMAGE}"
          
          rm -rf /tmp/docker-image
          
          crane auth logout ${DOCKER_REGISTRY}

          echo "Push complete"

      # After the image is pushed to ghcr, trigger the Jenkins job that mirrors
      # it to Artifact Registry. Passes the same commit-SHA tag that was pushed.
      - name: Trigger Jenkins image mirror
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_JOB: osrm-image-mirror
        run: |
          TAG="${GITHUB_SHA::6}"
          echo "Triggering Jenkins job '${JENKINS_JOB}' to mirror tag ${TAG}"
          # API-token auth bypasses CSRF for the REST API; -f fails the step on non-2xx.
          curl -fsSL -X POST \
            -u "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${JENKINS_URL}/job/${JENKINS_JOB}/buildWithParameters?IMAGE_TAG=${TAG}"
          echo "Jenkins mirror triggered."